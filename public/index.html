<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <script type="text/javascript">
      (function restoreSpaPath(location) {
        if (location.search[1] !== 'p' || location.search[2] !== '=') {
          return;
        }

        var urlParams = new URLSearchParams(location.search);
        var path = urlParams.get('p');

        if (!path) {
          return;
        }

        var query = urlParams.get('q');
        var search = query ? '?' + query.replace(/~and~/g, '&') : '';

        window.history.replaceState(null, '', path + search + location.hash);
      })(window.location);
    </script>
    <title>Dmytro Omelian</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
